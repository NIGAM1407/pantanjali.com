<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Dashboard - Patanjali</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css" />
  <style>
    body { background:#f8f9fa; }
    .sidebar {
      height: 100%;
      min-height: 100vh;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 20px;
    }
    .sidebar .nav-link {
      color: #333;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .sidebar .nav-link.active {
      background: #198754;
      color: #fff;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // ---------- Navbar ----------
    function Navbar() {
      return (
        <nav className="navbar navbar-expand-lg navbar-dark bg-success py-3 shadow fixed-top">
          <div className="container">
            <a className="navbar-brand d-flex align-items-center fs-3 fw-bold" href="index.html">
              <img
                src="./img/1.jpg"
                alt="Pantangali Logo"
                width="80"
                height="50"
                className="me-2 rounded"
              />
              Patanjali
            </a>
            <button
              className="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
            >
              <span className="navbar-toggler-icon"></span>
            </button>
            <div className="collapse navbar-collapse" id="navbarNav">
              <ul className="navbar-nav ms-auto fs-5">
                <li className="nav-item"><a className="nav-link text-white" href="index.html">Home</a></li>
                <li className="nav-item"><a className="nav-link text-white" href="products.html">Products</a></li>
                <li className="nav-item"><a className="nav-link text-white" href="#about">About</a></li>
                <li className="nav-item"><a className="nav-link text-white" href="#services">Services</a></li>
                <li className="nav-item"><a className="nav-link text-white" href="#contact">Contact Us</a></li>
              </ul>
              <a href="signup.html" className="btn btn-light btn-lg ms-3">Sign In</a>
            </div>
          </div>
        </nav>
      );
    }

    // ---------- Sidebar ----------
    function Sidebar({ active, setActive }) {
      const menuItems = [
        "Profile",
        "My Orders",
        "Returns",
        "Cancelled Orders",
        "Wishlist",
        "Account Settings",
        "Logout"
      ];

      return (
        <div className="sidebar">
          <h4 className="fw-bold mb-4">Dashboard</h4>
          <div className="nav flex-column">
            {menuItems.map((item, idx) => (
              <button
                key={idx}
                className={`nav-link text-start ${active === item ? "active" : ""}`}
                onClick={() => setActive(item)}
              >
                {item}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Main Content ----------
    function Content({ active }) {
      switch(active) {
        case "Profile":
          return (
            <div>
              <h3 className="fw-bold mb-3">My Profile</h3>
              <p><strong>Name:</strong> Ram Kumar</p>
              <p><strong>Email:</strong> ram@example.com</p>
              <p><strong>Phone:</strong> +91 9876543210</p>
              <p><strong>Address:</strong> 123, Surat, Gujarat</p>
            </div>
          );

        case "My Orders":
          return (
            <div>
              <h3 className="fw-bold mb-3">My Orders</h3>
              <div className="card mb-3 p-3 shadow-sm">
                <p><strong>Order ID:</strong> #12345</p>
                <p><strong>Product:</strong> Patanjali Aloe Vera Juice</p>
                <p><strong>Status:</strong> <span className="text-success">Delivered</span></p>
              </div>
              <div className="card mb-3 p-3 shadow-sm">
                <p><strong>Order ID:</strong> #12346</p>
                <p><strong>Product:</strong> Patanjali Cow Ghee</p>
                <p><strong>Status:</strong> <span className="text-warning">In Transit</span></p>
              </div>
            </div>
          );

        case "Returns":
          return (
            <div>
              <h3 className="fw-bold mb-3">Returns</h3>
              <p>No return requests found.</p>
            </div>
          );

        case "Cancelled Orders":
          return (
            <div>
              <h3 className="fw-bold mb-3">Cancelled Orders</h3>
              <div className="card mb-3 p-3 shadow-sm">
                <p><strong>Order ID:</strong> #12222</p>
                <p><strong>Product:</strong> Patanjali Honey</p>
                <p><strong>Status:</strong> <span className="text-danger">Cancelled</span></p>
              </div>
            </div>
          );

        case "Wishlist":
          return (
            <div>
              <h3 className="fw-bold mb-3">Wishlist</h3>
              <ul>
                <li>Patanjali Atta</li>
                <li>Patanjali Herbal Shampoo</li>
              </ul>
            </div>
          );

        case "Account Settings":
          return (
            <div>
              <h3 className="fw-bold mb-3">Account Settings</h3>
              <button className="btn btn-success me-2">Change Password</button>
              <button className="btn btn-outline-danger">Delete Account</button>
            </div>
          );

        case "Logout":
          return (
            <div>
              <h3 className="fw-bold">You have been logged out.</h3>
            </div>
          );

        default:
          return <h3>Welcome to your Dashboard</h3>;
      }
    }

    // ---------- Dashboard ----------
    function Dashboard() {
      const [active, setActive] = React.useState("Profile");

      return (
        <div className="container-fluid my-4">
          <div className="row">
            <div className="col-md-3 col-lg-2">
              <Sidebar active={active} setActive={setActive} />
            </div>
            <div className="col-md-9 col-lg-10 bg-white p-4 shadow-sm">
              <Content active={active} />
            </div>
          </div>
        </div>
      );
    }

    // ---------- App ----------
    function App() {
      return (
        <>
          <Navbar />
          <Dashboard />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Bootstrap JS -->
  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
