<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Account</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css" />
</head>
<body style="background:#f8f9fa">
  <div id="root"></div>

  <!-- React + ReactDOM + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function Verify() {
      return (
        <div className="container my-5">
          <div className="mx-auto p-4 rounded shadow bg-white" style={{maxWidth:"450px"}}>
            <h2 className="text-center mb-4">Verify Account</h2>
            <p className="text-center">Enter the 6-digit code sent to your email</p>
            <form>
              <div className="mb-3">
                <label className="form-label">Verification Code</label>
                <input type="text" className="form-control" maxLength="6" required />
              </div>
              <button type="submit" className="btn btn-success w-100">Verify</button>
            </form>
            <p className="mt-3 text-center">
              Didn’t receive a code? <a href="#">Resend</a>
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Verify />);
  </script>

  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
