<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantangali Website</title>

    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />

    <!-- React and ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <!-- Root Div for React -->
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        return (
          <div>
            {/* Navbar */}
            <nav className="navbar navbar-expand-lg navbar-dark bg-success py-3 shadow">
              <div className="container">
                {/* Logo with fixed width/height */}
                <a
                  className="navbar-brand d-flex align-items-center fs-3 fw-bold"
                  href="#"
                >
                  <img
                    src="./img/1.jpg"
                    alt="Logo"
                    width="80"
                    height="50"
                    className="me-2 rounded"
                  />
                  Pantangali
                </a>

                <button
                  className="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarNav"
                >
                  <span className="navbar-toggler-icon"></span>
                </button>

                <div className="collapse navbar-collapse" id="navbarNav">
                  <ul className="navbar-nav ms-auto fs-5">
                    <li className="nav-item">
                      <a className="nav-link text-white" href="#">
                        Home
                      </a>
                    </li>
                    <li className="nav-item">
                      <a className="nav-link text-white" href="#">
                        Product
                      </a>
                    </li>
                    <li className="nav-item">
                      <a className="nav-link text-white" href="#">
                        About
                      </a>
                    </li>
                    <li className="nav-item">
                      <a className="nav-link text-white" href="#">
                        
                      </a>
                    </li>
                    <li className="nav-item">
                      <a className="nav-link text-white" href="#">
                        Contact Us
                      </a>
                    </li>
                  </ul>
                  {/* Sign In Button */}
                  <button className="btn btn-light btn-lg ms-3">Sign In</button>
                </div>
              </div>
            </nav>

            {/* Hero Section */}
            <div className="container my-5">
              <div className="row align-items-center">
                <div className="col-md-6">
                  <h1 className="fw-bold display-4 text-success">
                    Before they sold out <br /> readymade gluten
                  </h1>
                  <p className="mt-3 fs-5">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    Harum pariatur modi maxime voluptatum fuga? Aliquid magnam
                    in doloremque eius corrupti laudantium voluptatem, ipsa,
                    velit officiis pariatur ad id exercitationem quo?
                  </p>
                  <div className="mt-4">
                    <button className="btn btn-success btn-lg me-2">Buy Now</button>
                    <button className="btn btn-outline-success btn-lg">
                      Learn More
                    </button>
                  </div>
                </div>
                <div className="col-md-6 text-center mt-4 mt-md-0">
                  <img
                    src="./img/1.jpg"
                    className="img-fluid rounded shadow"
                    alt="placeholder"
                  />
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>

    <!-- Local Bootstrap JS -->
    <script src="./js/bootstrap.bundle.min.js"></script>
  </body>
</html>
