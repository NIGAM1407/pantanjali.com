          { icon: "bi-shield-check", title: "Quality & Lab Tests", text: "Strict QA for purity and safety." },

              </h2>
            </div>
            <div className="row g-4">
              {items.map((s, i) => (
                <div key={i} className="col-sm-6 col-lg-4">
                  <div className="card h-100 shadow-sm">
                    <div className="card-body text-center">
                      <i className={`${s.icon} fs-1 text-success`}></i>
                      <h5 className="mt-3">{s.title}</h5>
                      <p className="mb-0">{s.text}</p>
